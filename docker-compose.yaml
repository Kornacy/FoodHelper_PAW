version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: Postgresql
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dockerweb
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_paw
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_MAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - dockerweb

  backend:
    build: 
      context: ./backend 
      dockerfile: Dockerfile
    container_name: API_FoodHelper
    ports:
      - "${PORT}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT={DB_PORT}
      - SESSION_SECRET=${SESSION_SECRET}
    command: npm run dev
    depends_on:
      - db
    networks:
      - dockerweb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: Client_FoodHelper
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app      
      - /app/node_modules   
    command: npm run dev
    networks:
      - dockerweb

volumes:
  pgdata:

networks:
  dockerweb:
    name: siec-paw-food-helper
    external: true